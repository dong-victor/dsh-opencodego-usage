# dsh-opencodego-usage bundle patch: inserts the dual-face plugin row into the
# web profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; activate with
# `dsh plugin --profile web add link:C:\Users\dongz\.dsh\workspace\dsh-opencodego-usage`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (balance route, agent tool, prompt announcement), and the
# `dsh.client` declaration in package.json makes the browser half
# (exports "./client", served at /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: opencode-go
      name: '@dong-victor/dsh-opencodego-usage'
